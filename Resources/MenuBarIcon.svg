<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 顶栏模板图标（黑白 + 透明）。白色部分在渲染后会被后处理成透明“挖洞”，
       由系统按模板自动着色，深色/浅色菜单栏都清晰。 -->
  <!-- 悬浮窗外壳 -->
  <rect x="5" y="4" width="30" height="24" rx="7" fill="#000000"/>
  <!-- 标题圆点（白色=后续转透明作挖洞） -->
  <circle cx="10" cy="9.5" r="1.8" fill="#FFFFFF"/>
  <circle cx="15.5" cy="9.5" r="1.8" fill="#FFFFFF"/>
  <circle cx="21" cy="9.5" r="1.8" fill="#FFFFFF"/>
  <!-- 内容条（白色=后续转透明作挖洞） -->
  <rect x="9" y="16.5" width="22" height="2.6" rx="1.3" fill="#FFFFFF"/>
  <rect x="9" y="21.5" width="15" height="2.6" rx="1.3" fill="#FFFFFF"/>
  <!-- 弹出小尾巴 -->
  <path d="M15 28 L20 34.5 L25 28 Z" fill="#000000"/>
</svg>
